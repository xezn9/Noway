# ضع هذا الملف في المستودع بالمسار:  .github/workflows/build.yml
# وارفع معه ملف المشروع LiquidGallery.zip في جذر المستودع (نفس المكان الي فيه مجلد .github).
# الـ workflow يفك الضغط داخل GitHub ويبني APK تلقائياً.

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        id: unzip
        shell: bash
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::ما لقيت ملف zip بجذر المستودع. ارفع LiquidGallery.zip هناك."
            exit 1
          fi
          echo "Unzipping: $ZIP"
          rm -rf _project
          mkdir -p _project
          unzip -q -o "$ZIP" -d _project

          # حدّد مجلد المشروع (الي فيه settings.gradle.kts) سواء كان بالجذر أو داخل مجلد
          SETTINGS=$(find _project -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::ما لقيت settings.gradle(.kts) داخل الـ zip."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
          build-root-directory: ${{ steps.unzip.outputs.dir }}

      - name: Build debug APK
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGallery-debug-apk
          path: ${{ steps.unzip.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
