name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # يبحث عن مجلد المشروع (حيث يوجد settings.gradle.kts) أياً كان موضعه في المستودع
      - name: Locate Gradle project
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts غير موجود في المستودع. ارفع محتويات المشروع كاملة."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Project dir: $(dirname "$f")"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # runner ubuntu-latest يحوي Android SDK جاهزاً (ANDROID_HOME)؛ نكتفي بقبول التراخيص
      # ويحمّل AGP أي حزمة ناقصة تلقائياً. الخطوة متسامحة مع الأخطاء عمداً.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # المشروع بلا Gradle Wrapper، لذلك نثبّت Gradle مباشرة (AGP 8.11.1 يتطلب 8.13 فأعلى)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfGlass-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
