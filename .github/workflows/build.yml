name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      project_zip_url:
        description: "Optional direct URL to the project ZIP. Leave blank to use a ZIP in the repository root."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download or locate project ZIP
        id: project
        shell: bash
        env:
          PROJECT_ZIP_URL: ${{ inputs.project_zip_url }}
        run: |
          set -euo pipefail
          if [[ -n "${PROJECT_ZIP_URL}" ]]; then
            curl --fail --location --retry 3 "${PROJECT_ZIP_URL}" -o "${RUNNER_TEMP}/android-project.zip"
            echo "zip_path=${RUNNER_TEMP}/android-project.zip" >> "$GITHUB_OUTPUT"
          else
            ZIP_PATH="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' ! -name 'build-output.zip' -print -quit)"
            if [[ -z "${ZIP_PATH}" ]]; then
              echo "No ZIP found in the repository root. Upload the project ZIP to the repository root, or rerun this workflow with project_zip_url set to a direct ZIP download URL."
              exit 1
            fi
            echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract project ZIP
        id: extract
        shell: bash
        env:
          ZIP_PATH: ${{ steps.project.outputs.zip_path }}
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/extracted-project"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          # Find the directory containing the top-level Gradle settings file.
          SETTINGS_FILE="$(find "$DEST" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "The ZIP was extracted, but no settings.gradle or settings.gradle.kts was found."
            echo "Make sure the ZIP contains the Android/Gradle project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=${PROJECT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Gradle project found at: ${PROJECT_DIR}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
