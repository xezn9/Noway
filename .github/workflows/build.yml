name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (Lumina.zip or the first .zip in the repo)
        run: |
          ZIP=""
          if [ -f Lumina.zip ]; then ZIP="Lumina.zip"; else ZIP="$(find . -maxdepth 2 -name '*.zip' | head -n 1)"; fi
          if [ -z "$ZIP" ]; then echo "No .zip file found in the repository"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p app
          unzip -q -o "$ZIP" -d app
          # in case the zip contains a single top-level folder
          if [ ! -f app/pubspec.yaml ]; then
            INNER="$(dirname "$(find app -maxdepth 3 -name pubspec.yaml | head -n 1)")"
            if [ -z "$INNER" ] || [ "$INNER" = "." ]; then echo "pubspec.yaml not found in zip"; exit 1; fi
            mv "$INNER"/* app/ 2>/dev/null || true
          fi
          ls -la app app/lib

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true

      - name: Generate Android project (keeps our lib/ and pubspec.yaml)
        working-directory: app
        run: |
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --platforms=android --org com.lumina.enhancer --project-name lumina_enhancer .
          rm -rf lib && cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -rf test

      - name: Patch AndroidManifest (internet + storage + app name)
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application|' "$M"
          sed -i 's|android:label="[^"]*"|android:label="Lumina"|' "$M"
          cat "$M"

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release (optional)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumina build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
