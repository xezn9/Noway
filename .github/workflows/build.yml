name: Build Editor DEX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Extract dex files
        run: |
          mkdir -p out
          unzip -o app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' -d out
          cp README.md out/ || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: editor-dex
          path: out/
