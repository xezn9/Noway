name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          ZIP=$(ls *.zip | head -n1)
          echo "Found: $ZIP"
          unzip -q "$ZIP" -d _project
          SETTINGS=$(find _project -maxdepth 3 -name settings.gradle.kts | head -n1)
          echo "PROJ_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" != "0" ]; then
            echo "=================== REAL ERROR ==================="
            grep -n -A12 -E "AAR metadata|Dependency '|What went wrong|^e: " build.log | head -n 80
            echo "=================================================="
          fi
          exit $CODE
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassArchiver-debug-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/*.apk
