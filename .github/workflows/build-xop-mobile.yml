name: Build XopProtector Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'xop-protector-mobile-starter.zip'
      - '.github/workflows/build-xop-mobile.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP exists
        run: test -f xop-protector-mobile-starter.zip

      - name: Extract Android project
        run: |
          mkdir -p unpacked-project
          unzip -q -o xop-protector-mobile-starter.zip -d unpacked-project
          test -f unpacked-project/xop-mobile/android/build.gradle.kts
          test -f unpacked-project/xop-mobile/android/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: unpacked-project/xop-mobile/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xop-protector-mobile-debug-apk
          path: unpacked-project/xop-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
