name: Build XopProtector Android APK (JVM 17 fix)

on:
  workflow_dispatch:
  push:
    paths:
      - 'xop-protector-mobile-starter.zip'
      - '.github/workflows/build-xop-mobile-jvm17.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP exists
        run: test -f xop-protector-mobile-starter.zip

      - name: Extract Android project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xop-project"
          unzip -q -o xop-protector-mobile-starter.zip -d "$RUNNER_TEMP/xop-project"
          SETTINGS_FILE="$(find "$RUNNER_TEMP/xop-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS_FILE"
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"
          echo "Gradle project: $(dirname "$SETTINGS_FILE")"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Force Java and Kotlin targets to 17
        shell: bash
        run: |
          set -euo pipefail
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$APP_GRADLE" || { echo "Missing app Gradle file: $APP_GRADLE"; find "$PROJECT_DIR" -maxdepth 5 -type f -name 'build.gradle*'; exit 1; }
          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          s = p.read_text()
          # Ensure Java bytecode is 17 even if the ZIP contains older Java 8 settings.
          if 'compileOptions {' in s:
              s = re.sub(r'compileOptions\s*\{.*?\}', 'compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }', s, flags=re.S)
          else:
              s = re.sub(r'(android\s*\{)', r'\1\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }', s, count=1)
          if 'kotlinOptions {' in s:
              s = re.sub(r'kotlinOptions\s*\{.*?\}', 'kotlinOptions {\n        jvmTarget = "17"\n    }', s, flags=re.S)
          else:
              s = re.sub(r'(android\s*\{)', r'\1\n    kotlinOptions { jvmTarget = "17" }', s, count=1)
          p.write_text(s)
          print(p.read_text())
          PY

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xop-protector-mobile-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
